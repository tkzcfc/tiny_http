name: build_for_linux

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update && sudo apt install musl-tools -y
      
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-unknown-linux-musl

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build admin frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Build
      id: build
      env:
        CC: musl-gcc
        RUSTFLAGS: "-C target-feature=+crt-static -C relocation-model=static"
        CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      run: cargo build --release --target x86_64-unknown-linux-musl

    - name: Verify Binary
      run: file ./target/x86_64-unknown-linux-musl/release/tiny-http

    - name: Package release
      run: |
        mkdir -p dist/tiny-http-linux-x86_64/frontend
        cp ./target/x86_64-unknown-linux-musl/release/tiny-http dist/tiny-http-linux-x86_64/
        cp -r frontend/dist dist/tiny-http-linux-x86_64/frontend/
        tar -czf dist/tiny-http-linux-x86_64.tar.gz -C dist tiny-http-linux-x86_64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tiny-http-linux-x86_64
        path: dist/tiny-http-linux-x86_64.tar.gz
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/tiny-http-linux-x86_64.tar.gz
        

